version: "2.0"
description: "Agent library — generieke layers, stacks, skills + hooks, scoped per project"
owner: "Badr"

# Layers = markdown-context die de agent op een bepaalde locatie laadt.
# scope bepaalt waar de layer actief is (pad-glob).
# target is waar setup.sh de symlink aanmaakt.
# depends_on: lijst van andere layers die mee-gelinkt worden (setup.sh
#   concateneert ze in volgorde vóór de eigen source).

layers:
  - name: global
    description: "Werkstijl, kwaliteit, verificatie, communicatie, taal. Overal actief."
    source: layers/global.md
    target: ~/.claude/CLAUDE.md
    scope: "*"
    depends_on: [repos-shared]

  - name: repos-shared
    description: "Git, commits, tests, security — beschikbaar als dependency."
    source: layers/repos-shared.md
    scope: "composable"

  # --- Stack layers (composable) ---
  - name: node-express
    description: "Node.js + Express conventies: structuur, error handling, env, deps."
    source: layers/stacks/node-express.md
    scope: "composable"

  - name: supabase
    description: "Supabase conventies: connectie, RLS, migrations, veelgemaakte fouten."
    source: layers/stacks/supabase.md
    scope: "composable"

  - name: vercel-deploy
    description: "Vercel deploy conventies: config, serverless, pre-deploy checklist."
    source: layers/stacks/vercel-deploy.md
    scope: "composable"

  - name: dart-flutter
    description: "Dart + Flutter conventies: structuur, state management, build, assets."
    source: layers/stacks/dart-flutter.md
    scope: "composable"

  - name: python
    description: "Python conventies: venv, type hints, pytest, packaging."
    source: layers/stacks/python.md
    scope: "composable"

  - name: react
    description: "React conventies: components, state, performance, testing."
    source: layers/stacks/react.md
    scope: "composable"

  - name: go
    description: "Go conventies: project layout, error handling, concurrency, testing."
    source: layers/stacks/go.md
    scope: "composable"

  # --- Project layers ---
  - name: whatsapp-bot
    description: "ZendIQ bot: Node, Supabase, Twilio, publishers, BTW-classifier, boekhouddienst."
    source: layers/projects/whatsapp-bot.md
    target: ~/Whatsapp-bot/CLAUDE.md
    scope: "~/Whatsapp-bot/*"
    depends_on: [node-express, supabase]  # repos-shared zit al in de globale CLAUDE.md

  - name: honey-shop
    description: "By Amina's Honing: statisch prototype naast de Shopify-store."
    source: layers/projects/honey-shop.md
    target: ~/repos/honey-shop/CLAUDE.md
    scope: "~/repos/honey-shop/*"

  - name: koffieshop
    description: "SMEULWERK: specialty-koffie prototype, DESIGN.md leidend, fase 2 Shopify."
    source: layers/projects/koffieshop.md
    target: ~/repos/koffieshop/CLAUDE.md
    scope: "~/repos/koffieshop/*"

  - name: darija-app
    description: "Yallah Zaza: Darija-speelapp, audio-injectie build, Badrs eigen stem."
    source: layers/projects/darija-app.md
    target: ~/repos/darija-app/CLAUDE.md
    scope: "~/repos/darija-app/*"

  - name: driveadmin-bot
    description: "Google Drive admin bot: Node.js."
    source: layers/projects/driveadmin-bot.md
    target: ~/driveadmin-bot/CLAUDE.md
    scope: "~/driveadmin-bot/*"
    depends_on: [repos-shared, node-express]

  - name: addayn
    description: "Dart/Flutter applicatie."
    source: layers/projects/addayn.md
    target: ~/Addayn/CLAUDE.md
    scope: "~/Addayn/*"
    depends_on: [repos-shared, dart-flutter]

  - name: eaa-leadmachine
    description: "EAA-webshopdienst: WCAG-scans, rapporten, mailconcepten; nooit auto-mailen."
    source: layers/projects/eaa-leadmachine.md
    target: ~/repos/eaa-leadmachine/CLAUDE.md
    scope: "~/repos/eaa-leadmachine/*"

  - name: orderflow-suite
    description: "OrderFlow Suite: multi-tenant TMS voor B2B cargo (React/Vite, Supabase, Vercel). Geparkeerd sinds mei 2026."
    source: layers/projects/orderflow-suite.md
    target: ~/Desktop/DevBadr/orderflow-suite/CLAUDE.md
    scope: "~/Desktop/DevBadr/orderflow-suite/*"
    depends_on: [supabase, vercel-deploy]

  - name: driver-acquisition
    description: "ZendIQ driver acquisition: KvK/Maps scraping, email/voice outreach."
    source: layers/projects/driver-acquisition.md
    target: ~/driver-acquisition/CLAUDE.md
    scope: "~/driver-acquisition/*"
    depends_on: [repos-shared, node-express, supabase]

# Skills = herbruikbare procedures (SKILL.md met frontmatter).
# Convention-over-config: alleen name, description, source nodig.
# setup.sh leidt target (~/.claude/skills/<name>/SKILL.md), scope (*),
# en type (md) automatisch af als ze ontbreken.
# BEPERKING: descriptions moeten op één regel staan — de bash-parser
# ondersteunt geen multiline YAML scalars (>, |).
skills:
  - name: plan-feature
    description: "Van intent naar stappenplan, voor je code aanraakt."
    source: skills/plan-feature/SKILL.md

  - name: systematic-debug
    description: "Bug reproduceren, hypothese, één ding per keer verifieren."
    source: skills/systematic-debug/SKILL.md


  - name: verify-before-done
    description: "Bewijs vóór je 'klaar' claimt."
    source: skills/verify-before-done/SKILL.md

  - name: commit-netjes
    description: "Eén doel per commit, conventional message, geen git add ."
    source: skills/commit-netjes/SKILL.md

  - name: project-bootstrap
    description: "Nieuw project opzetten: repo, config, layer, eerste commit."
    source: skills/project-bootstrap/SKILL.md

  - name: deploy-checklist
    description: "Pre-deploy checks, deploy, post-deploy verificatie."
    source: skills/deploy-checklist/SKILL.md

  - name: context-resume
    description: "Werk hervatten: git log, backlog, huidige staat inlezen."
    source: skills/context-resume/SKILL.md

  - name: research-spike
    description: "Timeboxed technologie-evaluatie: vraag, opties, conclusie."
    source: skills/research-spike/SKILL.md

  - name: zondag-triage
    description: "Product: signalen, ranglijst, max twee experimenten met criterium en meetdatum."
    source: skills/zondag-triage/SKILL.md

  - name: effectmeting
    description: "Product: experiment meten tegen criterium; behouden, terugdraaien of langer meten."
    source: skills/effectmeting/SKILL.md

  - name: afdeling-update
    description: "Leren: logboek-regel, company/*.md bijwerken, pagina genereren en publiceren."
    source: skills/afdeling-update/SKILL.md

  - name: analyze-flow
    description: "Webhook-, API- of state-flow stap voor stap expliciet maken vóór een fix."
    source: skills/analyze-flow/SKILL.md

  - name: concurrentie-analyse
    description: "Markt en concurrenten begrijpen vóór marketing, pricing of productpagina's."
    source: skills/concurrentie-analyse/SKILL.md
  - name: incident-response
    description: "Productie-incident: triage, mitigeer, root cause, postmortem."
    source: skills/incident-response/SKILL.md

  - name: launch-checklist
    description: "Project lanceren: landing page, kanalen, copy, timing, post-launch."
    source: skills/launch-checklist/SKILL.md

  - name: project-status
    description: "Voortgang bekijken: backlog, git activiteit, milestones, volgende stap."
    source: skills/project-status/SKILL.md
  - name: webdesign-best-in-class
    description: "Websites ontwerpen en verbeteren: context, benchmark, hiërarchie, mobile first, conversie, eindcontrole."
    source: skills/webdesign-best-in-class/SKILL.md

  - name: scrapling
    description: "Data uit websites halen: juiste fetcher kiezen, anti-bot, adaptive selectors."
    source: skills/scrapling/SKILL.md

  - name: seo-audit
    description: "SEO-audit: crawl zonder scriptinhoud, snelheid via PageSpeed of lokale Lighthouse, Search Console via de browser, vondsten tegen de bron."
    source: skills/seo-audit/SKILL.md

  - name: meta-ads-inrichten
    description: "Meta Ads inrichten: accounts en portfolios, juridische naam, advertentieaccount, pixel achter consent, domein- en bedrijfsverificatie."
    source: skills/meta-ads-inrichten/SKILL.md

# Hooks = shell-scripts die Claude Code automatisch triggert.
# settings-template.json bevat de Claude Code configuratie.
hooks:
  - name: session-start
    description: "Context laden bij start van een sessie."
    source: hooks/session-start.sh

  - name: pre-commit-reminder
    description: "Herinnering aan review/verify checklist bij commit."
    source: hooks/pre-commit-reminder.sh

  - name: protect-tests-during-fix
    description: "Blokkeert test-edits zolang .claude/fix-in-progress bestaat (fix de code, niet de test)."
    source: hooks/protect-tests-during-fix.sh

  - name: production-push-gate
    description: "Blokkeert git push naar main/master in repos met .claude/production-repo marker (CI deployt direct)."
    source: hooks/production-push-gate.sh

  - name: settings-template
    description: "Template voor ~/.claude/settings.json hooks-configuratie."
    source: hooks/settings-template.json

# Agents = subagents met eigen context en tool-limieten (.claude/agents/).
# setup.sh parseert deze sectie niet; handmatig deployen:
#   cp agents/verifier.md ~/.claude/agents/verifier.md
# - verifier: draait app/tests na implementatie en rapporteert bewijs,
#   met verse context (geen bias richting net geschreven code).
